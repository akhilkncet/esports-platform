<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournaments - Esports Platform</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <h1>🎮 Esports Platform</h1>
            </div>
            <ul class="nav-links">
                <li><a href="/">Home</a></li>
                <li><a href="/teams/">Teams</a></li>
                <li><a href="/tournaments/" class="active">Tournaments</a></li>
                <li><span id="usernameDisplay" style="color: var(--text-secondary); margin-left: 1rem;"></span></li>
                <li><button onclick="handleLogout()" class="btn btn-secondary btn-sm" style="margin-left: 1rem;">Logout</button></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        <section class="page-header">
            <h2>Tournaments</h2>
            <button class="btn btn-primary" onclick="showCreateTournamentModal()">+ Create Tournament</button>
        </section>

        <section class="filters">
            <input type="text" id="searchInput" placeholder="Search tournaments..." class="search-input">
            <select id="statusFilter" class="filter-select">
                <option value="">All Statuses</option>
                <option value="draft">Draft</option>
                <option value="registration">Registration Open</option>
                <option value="group_stage">Group Stage</option>
                <option value="final_stage">Final Stage</option>
                <option value="completed">Completed</option>
                <option value="cancelled">Cancelled</option>
            </select>
        </section>

        <section id="tournamentsContainer" class="tournaments-list">
            <p class="loading">Loading tournaments...</p>
        </section>
    </main>

    <!-- Create Tournament Modal -->
    <div id="createTournamentModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Create New Tournament</h3>
                <button class="close-btn" onclick="closeModal('createTournamentModal')">&times;</button>
            </div>
            <form id="createTournamentForm" onsubmit="handleCreateTournament(event)">
                <div class="form-group">
                    <label for="tournamentName">Tournament Name *</label>
                    <input type="text" id="tournamentName" required>
                </div>
                <div class="form-group">
                    <label for="tournamentDescription">Description</label>
                    <textarea id="tournamentDescription" rows="3"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="startDate">Start Date *</label>
                        <input type="datetime-local" id="startDate" required>
                    </div>
                    <div class="form-group">
                        <label for="endDate">End Date *</label>
                        <input type="datetime-local" id="endDate" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="prizePool">Prize Pool ($)</label>
                        <input type="number" id="prizePool" step="0.01" min="0">
                    </div>
                    <div class="form-group">
                        <label for="maxTeams">Max Teams</label>
                        <input type="number" id="maxTeams" value="50" min="50" max="50" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="tournamentStatus">Status</label>
                    <select id="tournamentStatus">
                        <option value="draft">Draft</option>
                        <option value="registration">Registration Open</option>
                        <option value="group_stage">Group Stage</option>
                        <option value="final_stage">Final Stage</option>
                        <option value="completed">Completed</option>
                        <option value="cancelled">Cancelled</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('createTournamentModal')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Create Tournament</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Tournament Details Modal -->
    <div id="tournamentDetailsModal" class="modal">
        <div class="modal-content modal-large">
            <div class="modal-header">
                <h3 id="detailsTitle">Tournament Details</h3>
                <button class="close-btn" onclick="closeModal('tournamentDetailsModal')">&times;</button>
            </div>
            <div id="tournamentDetails">
                <p class="loading">Loading...</p>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Esports Platform. All rights reserved.</p>
        </div>
    </footer>

    <script src="/static/app.js"></script>
    <script>
        let allTournaments = [];

        async function loadTournaments() {
            // Check authentication first (non-blocking)
            checkAuthentication();

            try {
                allTournaments = await api.getTournaments();
                displayTournaments(allTournaments);
            } catch (error) {
                console.error('Error loading tournaments:', error);
                document.getElementById('tournamentsContainer').innerHTML = 
                    '<p class="error">Error loading tournaments. Make sure the backend server is running.</p>';
            }
        }

        function displayTournaments(tournaments) {
            const container = document.getElementById('tournamentsContainer');
            
            if (tournaments.length === 0) {
                container.innerHTML = '<p class="no-data">No tournaments found</p>';
                return;
            }

            container.innerHTML = tournaments.map(tournament => `
                <div class="tournament-card">
                    <div class="tournament-header">
                        <h3>${escapeHtml(tournament.name)}</h3>
                        <span class="status-badge status-${tournament.status}">${formatStatus(tournament.status)}</span>
                    </div>
                    <p class="tournament-description">${escapeHtml(tournament.description || 'No description')}</p>
                    <div class="tournament-meta">
                        <span>📅 ${formatDate(tournament.start_date)} - ${formatDate(tournament.end_date)}</span>
                        ${tournament.prize_pool ? `<span>💰 $${formatNumber(tournament.prize_pool)}</span>` : ''}
                        <span>👥 ${tournament.max_teams} teams</span>
                    </div>
                    <div class="tournament-actions">
                        <button class="btn btn-sm btn-primary" onclick="viewTournamentDetails(${tournament.id})">View Details</button>
                        <button class="btn btn-sm btn-secondary" onclick="editTournament(${tournament.id})">Edit</button>
                        <button class="btn btn-sm btn-danger" onclick="deleteTournament(${tournament.id})">Delete</button>
                    </div>
                </div>
            `).join('');
        }

        function filterTournaments() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const statusFilter = document.getElementById('statusFilter').value;

            let filtered = allTournaments.filter(tournament => {
                const matchesSearch = tournament.name.toLowerCase().includes(searchTerm) || 
                                    (tournament.description && tournament.description.toLowerCase().includes(searchTerm));
                
                const matchesStatus = !statusFilter || tournament.status === statusFilter;
                
                return matchesSearch && matchesStatus;
            });

            displayTournaments(filtered);
        }

        function showCreateTournamentModal() {
            document.getElementById('createTournamentModal').style.display = 'flex';
        }

        async function handleCreateTournament(event) {
            event.preventDefault();
            
            const userId = localStorage.getItem('userId');
            
            const tournamentData = {
                name: document.getElementById('tournamentName').value,
                description: document.getElementById('tournamentDescription').value,
                start_date: document.getElementById('startDate').value,
                end_date: document.getElementById('endDate').value,
                prize_pool: document.getElementById('prizePool').value || null,
                max_teams: parseInt(document.getElementById('maxTeams').value),
                status: document.getElementById('tournamentStatus').value,
                organizer: parseInt(userId) // Use logged-in user's ID
            };

            try {
                await api.createTournament(tournamentData);
                closeModal('createTournamentModal');
                document.getElementById('createTournamentForm').reset();
                await loadTournaments();
                showNotification('Tournament created successfully!', 'success');
            } catch (error) {
                console.error('Error creating tournament:', error);
                showNotification('Error creating tournament: ' + error.message, 'error');
            }
        }

        async function viewTournamentDetails(tournamentId) {
            document.getElementById('tournamentDetailsModal').style.display = 'flex';
            document.getElementById('tournamentDetails').innerHTML = '<p class="loading">Loading details...</p>';
            
            try {
                const [tournament, groups, matches] = await Promise.all([
                    api.getTournament(tournamentId),
                    api.getGroups(tournamentId),
                    api.getMatches()
                ]);

                document.getElementById('detailsTitle').textContent = tournament.name;
                
                const tournamentMatches = matches.filter(m => 
                    groups.some(g => g.id === m.group)
                );

                document.getElementById('tournamentDetails').innerHTML = `
                    <div class="details-section">
                        <h4>Tournament Information</h4>
                        <p><strong>Status:</strong> <span class="status-badge status-${tournament.status}">${formatStatus(tournament.status)}</span></p>
                        <p><strong>Description:</strong> ${escapeHtml(tournament.description || 'No description')}</p>
                        <p><strong>Start Date:</strong> ${formatDate(tournament.start_date)}</p>
                        <p><strong>End Date:</strong> ${formatDate(tournament.end_date)}</p>
                        ${tournament.prize_pool ? `<p><strong>Prize Pool:</strong> $${formatNumber(tournament.prize_pool)}</p>` : ''}
                        <p><strong>Max Teams:</strong> ${tournament.max_teams}</p>
                    </div>
                    
                    <div class="details-section">
                        <h4>Groups (${groups.length})</h4>
                        ${groups.length > 0 ? `
                            <div class="groups-list">
                                ${groups.map(group => `
                                    <div class="group-item">
                                        <strong>Group ${group.name}</strong> - ${group.teams ? group.teams.length : 0} teams
                                    </div>
                                `).join('')}
                            </div>
                        ` : '<p class="no-data">No groups created yet</p>'}
                    </div>
                    
                    <div class="details-section">
                        <h4>Matches (${tournamentMatches.length})</h4>
                        ${tournamentMatches.length > 0 ? `
                            <div class="matches-list">
                                ${tournamentMatches.map(match => `
                                    <div class="match-item">
                                        <span>Match #${match.match_number}</span>
                                        <span class="status-badge status-${match.status}">${formatStatus(match.status)}</span>
                                        <span>${formatDate(match.scheduled_time)}</span>
                                    </div>
                                `).join('')}
                            </div>
                        ` : '<p class="no-data">No matches scheduled yet</p>'}
                    </div>
                `;
            } catch (error) {
                console.error('Error loading tournament details:', error);
                document.getElementById('tournamentDetails').innerHTML = 
                    '<p class="error">Error loading tournament details</p>';
            }
        }

        async function deleteTournament(tournamentId) {
            if (!confirm('Are you sure you want to delete this tournament?')) {
                return;
            }

            try {
                await api.deleteTournament(tournamentId);
                await loadTournaments();
                showNotification('Tournament deleted successfully!', 'success');
            } catch (error) {
                console.error('Error deleting tournament:', error);
                showNotification('Error deleting tournament: ' + error.message, 'error');
            }
        }

        async function editTournament(tournamentId) {
            showNotification('Edit functionality coming soon!', 'info');
        }

        // Event listeners
        document.getElementById('searchInput').addEventListener('input', filterTournaments);
        document.getElementById('statusFilter').addEventListener('change', filterTournaments);
        document.addEventListener('DOMContentLoaded', loadTournaments);
    </script>
</body>
</html>
